<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weave Machine</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<aside>
  <h1>Weave Machine</h1>

  <fieldset>
    <legend>画布 Canvas (px)</legend>
    <div class="row">
      <label>宽 <input id="W" type="number" value="1600" min="100" max="8000"></label>
      <label>高 <input id="H" type="number" value="1600" min="100" max="8000"></label>
    </div>
  </fieldset>

  <fieldset>
    <legend>导入 Import</legend>
    <label class="file">图像 A <input id="fileA" type="file" accept="image/*"></label>
    <label class="file">图像 B <input id="fileB" type="file" accept="image/*"></label>
    <label class="file">图像 C(网点来源)<input id="fileC" type="file" accept="image/*"></label>
  </fieldset>

  <fieldset>
    <legend>图层 Layer</legend>
    <div class="tabs">
      <label><input type="radio" name="layer" value="A" checked><span>A</span></label>
      <label><input type="radio" name="layer" value="B"><span>B</span></label>
      <label><input type="radio" name="layer" value="C"><span>C 蒙版</span></label>
    </div>
    <label>缩放 <input id="scale" type="range" min="0.2" max="4" step="0.01" value="1"></label>
    <button id="resetPos" type="button">重置位置和缩放</button>
    <p class="hint">在画布上拖动，移动当前图层。</p>
  </fieldset>

  <fieldset>
    <legend>蒙版 Mask</legend>
    <label>算法
      <select id="algo">
        <option value="checker">棋盘格（不需要 C）</option>
        <option value="threshold">Threshold</option>
        <option value="bayer4">Bayer 4×4</option>
        <option value="bayer8">Bayer 8×8</option>
        <option value="random">Random</option>
        <option value="halftone">Halftone（网点大小随明暗）</option>
      </select>
    </label>
    <label>形状
      <select id="shape">
        <option value="square">方</option>
        <option value="circle">圆</option>
      </select>
    </label>
    <label>格子大小 <input id="cell" type="range" min="4" max="200" step="1" value="40"></label>
    <label>Threshold <input id="thr" type="range" min="0" max="1" step="0.01" value="0.5"></label>
    <label>预模糊 C <input id="cblur" type="range" min="0" max="60" step="1" value="0"></label>
    <label>边缘柔化 <input id="soft" type="range" min="0" max="40" step="1" value="0"></label>
    <label class="check"><input id="inv" type="checkbox"> 反相（正 / 负型）</label>
    <label class="check"><input id="showMask" type="checkbox"> 只看蒙版</label>
  </fieldset>

  <fieldset>
    <legend>导出 Export</legend>
    <label>倍率
      <select id="exp">
        <option value="1">1x</option>
        <option value="2">2x</option>
        <option value="4">4x</option>
      </select>
    </label>
    <button id="save" type="button">下载 PNG</button>
  </fieldset>
</aside>

<main>
  <canvas id="cv"></canvas>
</main>

<script src="sketch.js"></script>
</body>
</html>
